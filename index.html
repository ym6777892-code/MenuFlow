<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="theme-color" content="#14100d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a class="brand" href="#top" aria-label="Layali Al-Sham">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f0cf8e"/><stop offset="1" stop-color="#b8842e"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="29" fill="none" stroke="url(#lg)" stroke-width="2.5"/>
        <path d="M14 40h36a18 18 0 0 0-36 0Z" fill="url(#lg)"/>
        <rect x="11" y="42" width="42" height="4" rx="2" fill="url(#lg)"/>
        <circle cx="32" cy="19" r="3" fill="url(#lg)"/>
        <path d="M25 14c-2 2 2 3 0 6M39 14c-2 2 2 3 0 6" stroke="url(#lg)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <span>
        <span class="brand-name" data-i18n="brandName">ليالي الشام</span><br>
        <span class="brand-sub" data-i18n="brandSub">LAYALI AL-SHAM</span>
      </span>
    </a>
    <button class="btn btn-sm" id="langToggle" type="button" aria-label="Change language">EN</button>
  </div>
</header>

<section class="hero" id="top">
  <div class="container">
    <span class="hero-badge" data-i18n="badge">قائمة الطعام</span>
    <h1 data-i18n-html="heroTitle">نكهة أصيلة، <span>وتجربة لا تُنسى</span></h1>
    <p data-i18n="heroText">أطباق شامية ومصرية محضّرة يوميًا من أجود المكوّنات الطازجة.</p>
  </div>
</section>

<div class="toolbar">
  <div class="container">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPh" placeholder="ابحث في القائمة...">
    </label>
    <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
  </div>
</div>

<main class="menu">
  <div class="container" id="menuRoot" aria-live="polite"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <span data-i18n="footer">© ليالي الشام — جميع الحقوق محفوظة. الأسعار بالجنيه المصري.</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="menu.js"></script>
